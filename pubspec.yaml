name: livsstil
description: "En app för hållbara livsstilsförändringar - identitet före mål"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#6B9B73"
  adaptive_icon_foreground: "icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

